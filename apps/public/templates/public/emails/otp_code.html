<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0; padding:0; background-color:#F6F3EC; font-family:Georgia, 'Times New Roman', serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F6F3EC; padding:32px 16px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px; background-color:#FFFFFF; border:1px solid #E5E0D4;">

  <!-- Header -->
  <tr>
    <td style="background-color:#15181B; padding:24px 32px;">
      <table role="presentation" cellpadding="0" cellspacing="0">
        <tr>
          <td style="width:32px; height:32px; background-color:#2B5245; border-radius:6px; text-align:center; vertical-align:middle;">
            <span style="color:#FFFFFF; font-size:13px; font-family:Arial, sans-serif;">&#127976;</span>
          </td>
          <td style="padding-left:12px;">
            <span style="color:#FFFFFF; font-size:15px; font-family:Georgia, serif;">{{ property_name }}</span>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- Body -->
  <tr>
    <td style="padding:40px 32px 8px; text-align:center;">
      <p style="font-family:Arial, sans-serif; font-size:11px; letter-spacing:0.06em; color:#8B8375; text-transform:uppercase; margin:0 0 14px;">Verify your email</p>
      <h1 style="font-family:Georgia, serif; font-size:20px; color:#15181B; margin:0 0 22px; font-weight:normal;">Your verification code</h1>

      <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
        <tr>
          <td style="background-color:#EFEAE0; border-radius:4px; padding:18px 36px;">
            <span style="font-family:Georgia, serif; font-size:32px; letter-spacing:0.18em; color:#15181B;">{{ code }}</span>
          </td>
        </tr>
      </table>

      <p style="font-family:Arial, sans-serif; font-size:12.5px; color:#8B8375; margin:22px 0 0;">This code expires in 10 minutes.</p>
      <p style="font-family:Arial, sans-serif; font-size:12px; color:#B8B0A0; margin:8px 0 0;">If you didn't request this, you can ignore this email.</p>
    </td>
  </tr>

  <!-- Footer -->
  <tr>
    <td style="padding:32px;"></td>
  </tr>
  <tr>
    <td style="background-color:#15181B; padding:20px 32px; text-align:center;">
      <p style="font-family:Arial, sans-serif; font-size:11.5px; color:rgba(255,255,255,0.45); margin:0;">{{ property_name }}</p>
    </td>
  </tr>

</table>
</td></tr>
</table>
</body>
</html>

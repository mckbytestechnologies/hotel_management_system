{% extends "dashboard/base.html" %}
{% block title %}Delete {{ object }}{% endblock %}
{% block page_title %}Delete Confirmation{% endblock %}

{% block content %}
<div class="max-w-lg">
    <div class="card p-6">
        <div class="flex items-center gap-3 mb-4">
            <div class="w-11 h-11 rounded-xl bg-rose-50 flex items-center justify-center">
                <i class="fa-solid fa-triangle-exclamation text-rose-500"></i>
            </div>
            <div>
                <h2 class="text-[15px] font-bold text-ink-900">Delete this record?</h2>
                <p class="text-[12px] text-ink-400 font-medium">This can't be undone.</p>
            </div>
        </div>
        <p class="text-[13px] text-ink-700 font-medium mb-6">
            Are you sure you want to delete <strong>{{ object }}</strong>?
        </p>
        <form method="post" class="flex gap-3">
            {% csrf_token %}
            <button type="submit" class="px-4 py-2.5 rounded-lg bg-rose-600 text-white text-[12.5px] font-bold hover:bg-rose-700 transition">
                Yes, Delete
            </button>
            <a href="{{ cancel_url }}" class="px-4 py-2.5 rounded-lg border border-ink-200 text-[12.5px] font-semibold text-ink-500 hover:bg-ink-50 transition">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
